<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIFA Style Football</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div class="team team-left">
          <span class="team-name">Home</span>
          <span id="score-home" class="score">0</span>
        </div>
        <div class="center-panel">
          <div id="timer">90:00</div>
          <div class="controls">WASD Move · Space Shoot · Shift Sprint</div>
        </div>
        <div class="team team-right">
          <span id="score-away" class="score">0</span>
          <span class="team-name">Away</span>
        </div>
      </div>

      <canvas id="gameCanvas" width="960" height="540" aria-label="Soccer game field"></canvas>
    </div>

    <script src="game.js"></script>
  </body>
</html>
